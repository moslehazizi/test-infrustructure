services:
    control-panel-service-migration:
        image: challenge-control-panel-service:TAG_NAME
        container_name: challenge-control-panel-service-migration
        restart: no
        entrypoint: ["./main", "migrate", "up"]
        env_file:
            - ../.env
        networks:
            - backend
    control-panel-service:
        image: challenge-control-panel-service:TAG_NAME
        container_name: challenge-control-panel-service
        restart: unless-stopped
        ports:
            - "8082:8080"
        env_file:
            - ../.env
        networks:
            - backend
        depends_on:
          - control-panel-service-migration

networks:
    backend:
        external: true
