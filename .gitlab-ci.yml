stages:
    - lint
    - test
    - build
    - docker


image: golang:1.26
cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
        - go/pkg/mod
        - .cache/go-build

before_script:
    - go env -w GOPROXY=https://repo.tibobit.ir/repository/golang/,direct
    - go version
    - go mod download

lint:
  stage: lint
  image: golangci/golangci-lint:v2.11.3
  script:
    - golangci-lint -c=.golangci.yml run ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
    stage: test
    variables:
        CGO_ENABLED: 1
    script:
        - go test -cover -v ./...
        # - go test -v -race -cover ./...
    coverage: '/coverage: \d+\.\d+%/'
    rules:
        - if: $CI_COMMIT_BRANCH

build-app:
  stage: build
  script:
    - go build -ldflags="-s -w" -o main
  artifacts:
    paths:
      - main
      - Dockerfile.gitlab
    # expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

docker-build:
    stage: docker
    image: docker:24-dind
    services:
        - docker:24-dind
    variables:
        DOCKER_TLS_CERTDIR: ""
        GIT_STRATEGY: none
    before_script:
        - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    script:
        - ls -lah
        - docker build -f Dockerfile.gitlab -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
        - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
        - docker image rm $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    needs:
        - job: build-app
          artifacts: true

