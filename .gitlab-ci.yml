image: golang:1.26
cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
        - go/pkg/mod
        - .cache/go-build

before_script:
    # - go env -w GOPROXY=https://repo.tibobit.ir/repository/golang/,direct
    - go version
    - go mod download

