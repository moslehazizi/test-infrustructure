      updated_at:
        type: string
    type: object
  response.MotherServiceResponseByID:
    properties:
      data:
        $ref: '#/definitions/response.MotherService'
    type: object
  response.PaginatedMotherServices:
    properties:
      data:
        items:
          $ref: '#/definitions/response.MotherService'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  response.PaginatedTestScenario:
