info:
  contact: {}
paths:
  /api/v1/mother-services:
    post:
      consumes:
      - application/json
      description: Create a new mother service
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.MotherService'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Create a mother service
      tags:
      - mother-services
  /api/v1/mother-services/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific mother service by its ID
      parameters:
      - description: Mother service ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.MotherServiceResponseByID'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get mother service by ID
      tags:
      - mother-services
  /api/v1/mother-services/search:
    post:
      consumes:
      - application/json
      description: Get mother services with pagination support
      parameters:
      - description: Pagination request with page and per_page
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.PaginationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedMotherServices'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get paginated mother services
      tags:
      - mother-services
  /api/v1/test-categories:
    get:
      consumes:
      - application/json
      description: Retrieve all available test categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.TestCategory'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get all test categories
      tags:
      - test-categories
  /api/v1/test-categories/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific test category by its ID
      parameters:
      - description: Test category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TestCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get test category by ID
      tags:
      - test-categories
  /api/v1/test-scenarios:
    post:
      consumes:
      - application/json
      description: Create a new test scenario with configuration
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.TestScenario'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Create a test scenario
      tags:
      - test-scenarios
  /api/v1/test-scenarios/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific test scenario by its ID
      parameters:
      - description: Test scenario ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TestScenarioResponseByID'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get test scenario by ID
      tags:
      - test-scenarios
  /api/v1/test-scenarios/{id}/start:
    post:
      consumes:
      - application/json
      description: Retrieve a specific test scenario by its ID and start the scenario.
      parameters:
      - description: Test scenario ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Start a test scenario.
      tags:
      - test-scenarios
  /api/v1/test-scenarios/search:
    post:
      consumes:
      - application/json
      description: Get test scenarios with pagination support
      parameters:
      - description: Pagination request with page and per_page
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.TestScenarioPaginationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedTestScenario'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get paginated test scenarios
      tags:
      - test-scenarios
