        type: integer
      max_duration:
        type: integer
      max_requests:
        type: integer
      negative_value_rate:
        type: integer
      null_value_rate:
        type: integer
      random_request_delay_max:
        type: integer
      random_request_delay_min:
        type: integer
      random_test_number_max:
        type: integer
      random_test_number_min:
        type: integer
      real_value_rate:
        type: integer
      request_delay_duration:
        type: integer
      string_value_rate:
        type: integer
      zero_value_rate:
        type: integer
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  response.MotherService:
    properties:
      created_at:
        type: string
      database_name:
        type: string
      database_table_name:
        type: string
      exception_rate:
        type: integer
      id:
        type: integer
      name:
        type: string
      random_response_delay_max:
        type: integer
      random_response_delay_min:
        type: integer
      response_delay_duration:
        type: integer
      response_delay_rate:
        type: integer
      service_deployment_address:
