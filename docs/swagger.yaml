definitions:
  entity.MotherServiceStatus:
    enum:
    - pending
    - running
    - paused
    - stopped
    - aborted
    type: string
    x-enum-comments:
      MotherServiceStatusAborted: stop and delete containers. can not start again.
      MotherServiceStatusPaused: application level pause on sending request
      MotherServiceStatusPending: mother service just created
      MotherServiceStatusRunning: test is running on application level (sending level)
      MotherServiceStatusStopped: stop container but can start scenario again.
    x-enum-descriptions:
    - mother service just created
    - test is running on application level (sending level)
    - application level pause on sending request
    - stop container but can start scenario again.
    - stop and delete containers. can not start again.
    x-enum-varnames:
    - MotherServiceStatusPending
    - MotherServiceStatusRunning
    - MotherServiceStatusPaused
    - MotherServiceStatusStopped
    - MotherServiceStatusAborted
  entity.ScenarioStatus:
    enum:
    - pending
    - running
    - paused
    - stopped
    - aborted
    - succeed
    type: string
    x-enum-varnames:
    - ScenarioStatusPending
    - ScenarioStatusRunning
    - ScenarioStatusPaused
    - ScenarioStatusStopped
    - ScenarioStatusAborted
    - ScenarioStatusSucceed
  request.MotherService:
    properties:
      database_name:
        type: string
      database_table_name:
        type: string
      exception_rate:
        type: integer
      name:
        type: string
      random_response_delay_max:
        type: integer
      random_response_delay_min:
        type: integer
      response_delay_duration:
        type: integer
      response_delay_rate:
        type: integer
    type: object
  request.PaginationRequest:
    properties:
      page:
        type: integer
      per_page:
        type: integer
    type: object
  request.TestScenario:
    properties:
      auto_step_change_rate:
        type: integer
      execution_duration:
        type: integer
      max_test_service_count:
        type: integer
      mother_service_id:
        type: integer
      name:
        type: string
      test_category_id:
        type: integer
      test_service_config:
        $ref: '#/definitions/request.TestServiceConfigRequest'
    type: object
  request.TestScenarioPaginationRequest:
    properties:
