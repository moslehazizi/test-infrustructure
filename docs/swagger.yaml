  response.MotherService:
    properties:
      created_at:
        type: string
      database_name:
        type: string
      database_table_name:
        type: string
      exception_rate:
        type: integer
      id:
        type: integer
      name:
        type: string
      random_response_delay_max:
        type: integer
      random_response_delay_min:
        type: integer
      response_delay_duration:
        type: integer
      response_delay_rate:
        type: integer
      service_deployment_address:
        type: string
      status:
