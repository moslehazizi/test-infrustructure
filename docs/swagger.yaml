        type: integer
      long_string_value_rate:
        type: integer
      max_duration:
        type: integer
      max_requests:
        type: integer
      negative_value_rate:
        type: integer
      null_value_rate:
        type: integer
      random_request_delay_max:
        type: integer
      random_request_delay_min:
        type: integer
      random_test_number_max:
        type: integer
      random_test_number_min:
        type: integer
      real_value_rate:
        type: integer
      request_delay_duration:
        type: integer
      string_value_rate:
        type: integer
