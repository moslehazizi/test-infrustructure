definitions:
  control-panel-service_internal_server_dto_response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  entity.MotherServiceStatus:
    enum:
    - ready
    - running
    - paused
    - stopped
    - deleted
    - failed
    type: string
    x-enum-comments:
      MotherServiceStatusDeleted: stop and delete containers. can not start again.
      MotherServiceStatusFailed: provisioning permanently failed after retries
      MotherServiceStatusPaused: application level pause on sending request
      MotherServiceStatusReady: mother service just created
      MotherServiceStatusRunning: test is running on application level (sending level)
      MotherServiceStatusStopped: stop container but can start scenario again.
    x-enum-descriptions:
    - mother service just created
    - test is running on application level (sending level)
    - application level pause on sending request
    - stop container but can start scenario again.
    - stop and delete containers. can not start again.
    - provisioning permanently failed after retries
    x-enum-varnames:
    - MotherServiceStatusReady
    - MotherServiceStatusRunning
    - MotherServiceStatusPaused
    - MotherServiceStatusStopped
    - MotherServiceStatusDeleted
    - MotherServiceStatusFailed
  entity.ScenarioStatus:
    enum:
    - ready
    - pending
    - running
    - paused
    - stopped
    - deleted
    - succeed
    type: string
    x-enum-varnames:
    - ScenarioStatusReady
    - ScenarioStatusPending
    - ScenarioStatusRunning
    - ScenarioStatusPaused
    - ScenarioStatusStopped
    - ScenarioStatusDeleted
    - ScenarioStatusSucceed
  request.MotherService:
    properties:
      database_name:
        type: string
      database_table_name:
        type: string
      exception_rate:
        type: integer
      name:
        type: string
      random_response_delay_max:
        type: integer
      random_response_delay_min:
        type: integer
      response_delay_duration:
        type: integer
      response_delay_rate:
        type: integer
    type: object
  request.PaginationRequest:
    properties:
      page:
        type: integer
      per_page:
        type: integer
    type: object
  request.TestScenario:
    properties:
      execution_number_multi_agent:
        type: integer
      increase_agent_number:
        type: integer
      max_test_service_count:
        type: integer
      mother_service_id:
        type: integer
      name:
        type: string
      num_steps:
        type: integer
      test_category_id:
        type: integer
      test_service_config:
        $ref: '#/definitions/request.TestServiceConfigRequest'
    type: object
  request.TestScenarioPaginationRequest:
    properties:
      page:
        type: integer
      per_page:
        type: integer
    type: object
  request.TestScenarioUpdateRequest:
