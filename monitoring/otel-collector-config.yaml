receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317  # collector listens here; host port 4712 maps to this

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics → exposed for Prometheus to scrape
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: control_panel

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
